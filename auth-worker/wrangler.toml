name = "gist-oauth-broker"
main = "src/index.ts"
compatibility_date = "2026-03-01"

# Create namespace with: npx wrangler kv namespace create AUTH_FLOW
# Then replace placeholder below.
[[kv_namespaces]]
binding = "AUTH_FLOW"
id = "63ae3b0ffaa64bab814cc102b339ddbc"

# Non-secret allowlist. Add each app and every permitted origin.
[vars]
APP_CONFIG = '''
{
  "juice": [
    "https://juice.tinyk.ing",
    "https://tinykings.github.io",
    "http://localhost:3000"
  ],
  "blink": [
    "https://tinykings.github.io",
    "http://localhost:8000"
  ]
}
'''
# Native apps sign in with a custom-scheme redirect plus PKCE instead of an origin.
APP_REDIRECTS = '''
{
  "juice": ["juice://oauth"]
}
'''
APP_SCOPES = '''
{
  "juice": ["gist"],
  "blink": ["gist", "public_repo"]
}
'''
